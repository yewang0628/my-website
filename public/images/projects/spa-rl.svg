<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a1a"/>
      <stop offset="1" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="12" fill="url(#bg3)"/>

  <!-- Central PPO node -->
  <rect x="150" y="105" width="100" height="35" rx="10" fill="url(#gold2)" opacity="0.9"/>
  <text x="200" y="127" text-anchor="middle" fill="#0a0a1a" font-size="12" font-weight="bold" font-family="monospace">PPO Policy</text>

  <!-- Progress Estimator -->
  <rect x="40" y="55" width="130" height="32" rx="8" fill="url(#emerald)" opacity="0.85"/>
  <text x="105" y="76" text-anchor="middle" fill="#fff" font-size="9" font-family="monospace">Progress Estimator</text>

  <!-- Grounding Signal -->
  <rect x="230" y="55" width="130" height="32" rx="8" fill="#6366F1" opacity="0.7"/>
  <text x="295" y="76" text-anchor="middle" fill="#fff" font-size="9" font-family="monospace">Grounding Signal</text>

  <!-- Environment -->
  <rect x="120" y="215" width="160" height="32" rx="8" fill="#334155" opacity="0.8" stroke="#475569" stroke-width="1"/>
  <text x="200" y="236" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="monospace">WebShop / ALFWorld / VHome</text>

  <!-- Arrows -->
  <line x1="105" y1="87" x2="170" y2="105" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
  <line x1="295" y1="87" x2="230" y2="105" stroke="#6366F1" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="140" x2="200" y2="215" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="247" x2="200" y2="270" stroke="#94A3B8" stroke-width="1" opacity="0.3" stroke-dasharray="4 2"/>
  <!-- Reward feedback arrow back up -->
  <path d="M 320 230 Q 370 170 320 120" stroke="#A78BFA" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Step timeline -->
  <rect x="45" y="268" width="10" height="10" rx="2" fill="#10B981" opacity="0.8"/>
  <text x="60" y="277" fill="#6B7280" font-size="7" font-family="monospace">step 1</text>
  <rect x="105" y="268" width="10" height="10" rx="2" fill="#10B981" opacity="0.6"/>
  <text x="120" y="277" fill="#6B7280" font-size="7" font-family="monospace">step 2</text>
  <rect x="165" y="268" width="10" height="10" rx="2" fill="#F59E0B" opacity="0.5"/>
  <text x="180" y="277" fill="#6B7280" font-size="7" font-family="monospace">...</text>
  <rect x="225" y="268" width="10" height="10" rx="2" fill="#EF4444" opacity="0.6"/>
  <text x="240" y="277" fill="#6B7280" font-size="7" font-family="monospace">step n</text>

  <!-- Bottom legend -->
  <text x="200" y="293" text-anchor="middle" fill="#6B7280" font-size="8" font-family="monospace">Reward = α × Progress + β × Grounding</text>
</svg>
