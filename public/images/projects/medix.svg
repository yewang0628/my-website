<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1340"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="12" fill="url(#bg2)"/>

  <!-- LeadAgent central node -->
  <rect x="160" y="118" width="80" height="30" rx="8" fill="url(#teal)" opacity="0.9"/>
  <text x="200" y="138" text-anchor="middle" fill="#0F172A" font-size="10" font-weight="bold" font-family="monospace">LeadAgent</text>

  <!-- 3 Worker Agents -->
  <rect x="40" y="55" width="100" height="28" rx="8" fill="url(#rose)" opacity="0.85"/>
  <text x="90" y="74" text-anchor="middle" fill="#fff" font-size="9" font-family="monospace">Consultation</text>

  <rect x="40" y="210" width="100" height="28" rx="8" fill="url(#rose)" opacity="0.85"/>
  <text x="90" y="229" text-anchor="middle" fill="#fff" font-size="9" font-family="monospace">Diagnostic</text>

  <rect x="260" y="135" width="100" height="28" rx="8" fill="url(#rose)" opacity="0.85"/>
  <text x="310" y="154" text-anchor="middle" fill="#fff" font-size="9" font-family="monospace">Research</text>

  <!-- Connections -->
  <line x1="140" y1="69" x2="160" y2="123" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="224" x2="160" y2="143" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>
  <line x1="240" y1="133" x2="260" y2="145" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>

  <!-- 7 Skills row -->
  <text x="200" y="266" text-anchor="middle" fill="#6B7280" font-size="8" font-family="monospace">
    ⚕ Knowledge • Risk • Symptoms • Lifestyle • ICD-10 • Guidelines • Deep Research
  </text>

  <!-- Bottom legend -->
  <text x="200" y="284" text-anchor="middle" fill="#9CA3AF" font-size="9" font-family="monospace">Skills-Agent • ReAct Loop • Swarm • Mem0</text>
</svg>
